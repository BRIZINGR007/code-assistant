<div class="modal-header border-bottom">
    <div class="w-100 px-1 ">
        <h5 class="modal-title text-break mb-1">{{ reference.filePath }}</h5>
        <small class="text-muted d-block">File Reference</small>
    </div>
    <button type="button" class="btn-close px-3" aria-label="Close" (click)="closeModal()"></button>
</div>

<div class="modal-body p-0">
    <div class="code-container bg-light p-3 rounded">
        <markdown [data]="reference.code" lineNumbers [lineHighlight]="true"></markdown>
        <!-- <pre class="code-content mb-0 overflow-auto" [innerHTML]="formatBody(reference.code)"></pre> -->
    </div>
    <div class="p-3 d-flex justify-content-end">
        <button class="btn btn-sm btn-outline-secondary me-2" (click)="copyCode()">
            <i class="bi bi-clipboard me-1"></i>Copy Code
        </button>
    </div>
</div>
